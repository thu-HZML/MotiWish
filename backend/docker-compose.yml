services:
  db:
    image: postgres:16
    container_name: motiwish-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-motiwish}
      POSTGRES_USER: ${POSTGRES_USER:-motiwish_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-motiwish_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-motiwish_user} -d ${POSTGRES_DB:-motiwish}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
    container_name: motiwish-web
    restart: unless-stopped
    env_file:
      - ${MOTIWISH_ENV_FILE:-.env}
    environment:
      DB_ENGINE: django.db.backends.postgresql
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/common/health/', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    container_name: motiwish-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  static_data:
  media_data:
