services:
  db:
    image: postgres:16
    container_name: motiwish-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-motiwish}
      POSTGRES_USER: ${POSTGRES_USER:-motiwish_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-motiwish_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-motiwish_user} -d ${POSTGRES_DB:-motiwish}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
