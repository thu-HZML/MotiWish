openapi: 3.0.3
info:
  title: MotiWish Backend API
  version: 0.2.0
  description: 面向安卓端游戏化时间管理应用的统一后端接口。
paths:
  /api/v1/ai/report-jobs/:
    get:
      operationId: api_v1_ai_report_jobs_list
      summary: 获取 AI 报告任务列表
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - AI
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAIReportJobListResponseList'
          description: ''
    post:
      operationId: api_v1_ai_report_jobs_create
      summary: 创建 AI 报告任务
      tags:
      - AI
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIReportJob'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AIReportJob'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AIReportJob'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIReportJobCreateResponse'
          description: ''
  /api/v1/ai/report-jobs/{id}/:
    get:
      operationId: api_v1_ai_report_jobs_retrieve
      summary: 获取单个 AI 报告任务
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this AI报告任务.
        required: true
      tags:
      - AI
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIReportJobDetailResponse'
          description: ''
    put:
      operationId: api_v1_ai_report_jobs_update
      summary: 更新 AI 报告任务
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this AI报告任务.
        required: true
      tags:
      - AI
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIReportJob'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AIReportJob'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AIReportJob'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIReportJob'
          description: ''
    patch:
      operationId: api_v1_ai_report_jobs_partial_update
      summary: 部分更新 AI 报告任务
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this AI报告任务.
        required: true
      tags:
      - AI
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAIReportJob'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAIReportJob'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAIReportJob'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIReportJob'
          description: ''
    delete:
      operationId: api_v1_ai_report_jobs_destroy
      summary: 删除 AI 报告任务
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this AI报告任务.
        required: true
      tags:
      - AI
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/common/health/:
    get:
      operationId: api_v1_common_health_retrieve
      summary: 健康检查
      tags:
      - Common
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
              examples:
                健康检查响应:
                  value:
                    success: true
                    code: OK
                    message: 服务运行正常
                    data:
                      service: motiwish-backend
                      status: ok
          description: ''
  /api/v1/common/legal-documents/:
    get:
      operationId: api_v1_common_legal_documents_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLegalDocumentList'
          description: ''
  /api/v1/gacha/pools/:
    get:
      operationId: api_v1_gacha_pools_list
      summary: 获取卡池列表
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Gacha
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGachaPoolListResponseList'
          description: ''
  /api/v1/gacha/pools/{id}/:
    get:
      operationId: api_v1_gacha_pools_retrieve
      summary: 获取单个卡池
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 卡池.
        required: true
      tags:
      - Gacha
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GachaPoolDetailResponse'
          description: ''
  /api/v1/gacha/pools/{id}/draw/:
    post:
      operationId: api_v1_gacha_pools_draw_create
      summary: 执行一次抽卡
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 卡池.
        required: true
      tags:
      - Gacha
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GachaPool'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GachaPool'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GachaPool'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GachaDrawResponse'
          description: ''
  /api/v1/gacha/records/:
    get:
      operationId: api_v1_gacha_records_list
      summary: 获取抽卡记录
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Gacha
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGachaRecordListResponseList'
          description: ''
  /api/v1/gacha/records/{id}/:
    get:
      operationId: api_v1_gacha_records_retrieve
      summary: 获取单条抽卡记录
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 抽卡记录.
        required: true
      tags:
      - Gacha
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GachaRecordDetailResponse'
          description: ''
  /api/v1/reports/dashboard/:
    get:
      operationId: api_v1_reports_dashboard_retrieve
      summary: 获取仪表盘报表
      tags:
      - Reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardReportResponse'
          description: ''
  /api/v1/shop/items/:
    get:
      operationId: api_v1_shop_items_list
      summary: 获取愿望商品列表
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Shop
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWishItemListResponseList'
          description: ''
    post:
      operationId: api_v1_shop_items_create
      summary: 创建愿望商品
      tags:
      - Shop
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WishItem'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WishItem'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WishItem'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishItemCreateResponse'
          description: ''
  /api/v1/shop/items/{id}/:
    get:
      operationId: api_v1_shop_items_retrieve
      summary: 获取单个愿望商品
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 愿望商品.
        required: true
      tags:
      - Shop
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishItemDetailResponse'
          description: ''
    put:
      operationId: api_v1_shop_items_update
      summary: 更新愿望商品
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 愿望商品.
        required: true
      tags:
      - Shop
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WishItem'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WishItem'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WishItem'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishItem'
          description: ''
    patch:
      operationId: api_v1_shop_items_partial_update
      summary: 部分更新愿望商品
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 愿望商品.
        required: true
      tags:
      - Shop
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWishItem'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedWishItem'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedWishItem'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishItem'
          description: ''
    delete:
      operationId: api_v1_shop_items_destroy
      summary: 删除愿望商品
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 愿望商品.
        required: true
      tags:
      - Shop
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/shop/items/{id}/redeem/:
    post:
      operationId: api_v1_shop_items_redeem_create
      summary: 兑换愿望商品
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 愿望商品.
        required: true
      tags:
      - Shop
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WishItem'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WishItem'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WishItem'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishItemRedeemResponse'
          description: ''
  /api/v1/shop/redemptions/:
    get:
      operationId: api_v1_shop_redemptions_list
      summary: 获取兑换记录
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Shop
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRedemptionRecordListResponseList'
          description: ''
  /api/v1/shop/redemptions/{id}/:
    get:
      operationId: api_v1_shop_redemptions_retrieve
      summary: 获取单条兑换记录
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 兑换记录.
        required: true
      tags:
      - Shop
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedemptionRecordDetailResponse'
          description: ''
  /api/v1/tasks/tasks/:
    get:
      operationId: api_v1_tasks_tasks_list
      summary: 获取任务列表
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Tasks
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTaskListResponseList'
          description: ''
    post:
      operationId: api_v1_tasks_tasks_create
      summary: 创建任务
      tags:
      - Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
            examples:
              创建周期任务:
                value:
                  title: 背单词 30 分钟
                  description: 每天晚饭后完成
                  task_type: recurring
                  recurrence: daily
                  weekdays: []
                  month_days: []
                  metric_key: ''
                  target_value: null
                  progress_target: 100
                  reward_primary: 15
                  penalty_primary: 3
                  starts_on: '2026-04-21'
                  ends_on: null
                  due_at: null
                  status: active
                  tags:
                  - study
                  - english
                  ai_metadata:
                    source: manual
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Task'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Task'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCreateResponse'
          description: ''
  /api/v1/tasks/tasks/{id}/:
    get:
      operationId: api_v1_tasks_tasks_retrieve
      summary: 获取单个任务
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 任务.
        required: true
      tags:
      - Tasks
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRetrieveResponse'
          description: ''
    put:
      operationId: api_v1_tasks_tasks_update
      summary: 更新任务
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 任务.
        required: true
      tags:
      - Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Task'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Task'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
    patch:
      operationId: api_v1_tasks_tasks_partial_update
      summary: 部分更新任务
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 任务.
        required: true
      tags:
      - Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTask'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTask'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTask'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
    delete:
      operationId: api_v1_tasks_tasks_destroy
      summary: 删除任务
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 任务.
        required: true
      tags:
      - Tasks
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/tasks/tasks/{id}/complete/:
    post:
      operationId: api_v1_tasks_tasks_complete_create
      summary: 完成并结算任务
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 任务.
        required: true
      tags:
      - Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskAction'
            examples:
              任务结算请求:
                value:
                  occurrence_date: '2026-04-21'
                  progress: 100
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TaskAction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TaskAction'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCompleteResponse'
          description: ''
  /api/v1/tasks/tasks/history/:
    get:
      operationId: api_v1_tasks_tasks_history_retrieve
      summary: 获取任务历史记录
      tags:
      - Tasks
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskHistoryResponse'
          description: ''
  /api/v1/tasks/tasks/today/:
    get:
      operationId: api_v1_tasks_tasks_today_retrieve
      summary: 获取指定日期任务实例
      parameters:
      - in: query
        name: date
        schema:
          type: string
        description: 日期，格式 YYYY-MM-DD；不传则默认为今天
      tags:
      - Tasks
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskTodayResponse'
          description: ''
  /api/v1/users/auth/login/:
    post:
      operationId: api_v1_users_auth_login_create
      summary: 用户登录
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
            examples:
              登录请求:
                value:
                  username: alice
                  password: Password123
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                登录成功响应:
                  value:
                    success: true
                    code: OK
                    message: 登录成功
                    data:
                      access: eyJhbGciOiJIUzI1NiIs...
                      refresh: eyJhbGciOiJIUzI1NiIs...
                      user:
                        id: 1
                        username: alice
                        display_nickname: 爱丽丝
          description: ''
  /api/v1/users/auth/refresh/:
    post:
      operationId: api_v1_users_auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      summary: 刷新 JWT
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
            examples:
              刷新令牌请求:
                value:
                  refresh: eyJhbGciOiJIUzI1NiIs...
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
              examples:
                刷新令牌响应:
                  value:
                    success: true
                    code: OK
                    message: 刷新令牌成功
                    data:
                      access: eyJhbGciOiJIUzI1NiIs...
          description: ''
  /api/v1/users/auth/register/:
    post:
      operationId: api_v1_users_auth_register_create
      summary: 用户注册
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
            examples:
              注册请求:
                value:
                  username: alice
                  email: alice@example.com
                  password: Password123
                  nickname: 爱丽丝
                  gender: female
                  occupation: student
                  bio: 今天也要认真完成任务
                  timezone: Asia/Shanghai
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              examples:
                注册成功响应:
                  value:
                    success: true
                    code: OK
                    message: 注册成功
                    data:
                      access: eyJhbGciOiJIUzI1NiIs...
