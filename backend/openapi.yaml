components:
  schemas:
    AIReportJob:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: 创建时间
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: 更新时间
        report_type:
          $ref: '#/components/schemas/ReportTypeEnum'
        summary:
          type: string
          readOnly: true
          title: 报告摘要
        status:
          allOf:
          - $ref: '#/components/schemas/AIReportJobStatusEnum'
          readOnly: true
        prompt_context: {}
        result_payload:
          readOnly: true
        owner:
          type: integer
          readOnly: true
      required:
      - created_at
      - id
      - owner
      - report_type
      - result_payload
      - status
      - summary
      - updated_at
    AIReportJobCreateResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AIReportJob'
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
      required:
      - code
      - data
      - message
      - success
    AIReportJobDetailResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AIReportJob'
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
      required:
      - code
      - data
      - message
      - success
    AIReportJobListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AIReportJob'
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
      required:
      - code
      - data
      - message
      - success
    AIReportJobStatusEnum:
      enum:
      - pending
      - done
      - failed
      type: string
      description: |-
        * `pending` - 待生成
        * `done` - 已完成
        * `failed` - 失败
    AvailableTimeLevelEnum:
      enum:
      - limited
      - normal
      - ample
      - undisclosed
      type: string
      description: |-
        * `limited` - 很少
        * `normal` - 一般
        * `ample` - 充足
        * `undisclosed` - 暂不填写
    BlankEnum:
      enum:
      - ''
    ChronotypeEnum:
      enum:
      - morning
      - night
      - flexible
      - undisclosed
      type: string
      description: |-
        * `morning` - 早型
        * `night` - 晚型
        * `flexible` - 不固定
        * `undisclosed` - 暂不填写
    CurrencyTypeEnum:
      enum:
      - primary
      - secondary
      type: string
      description: |-
        * `primary` - 一级货币
        * `secondary` - 二级货币
    DashboardReportPayload:
      type: object
      properties:
        wallet:
          $ref: '#/components/schemas/DashboardWalletData'
        task_stats:
          $ref: '#/components/schemas/DashboardTaskStats'
      required:
      - task_stats
      - wallet
    DashboardReportResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/DashboardReportPayload'
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
      required:
      - code
      - data
      - message
      - success
    DashboardTaskStats:
      type: object
      properties:
        total:
          type: integer
        completed:
          type: integer
      required:
      - completed
      - total
    DashboardWalletData:
      type: object
      properties:
        primary_balance:
          type: integer
        secondary_balance:
          type: integer
      required:
      - primary_balance
      - secondary_balance
    DocumentTypeEnum:
      enum:
      - terms
      - privacy
      - data_collection
      - children
      type: string
      description: |-
