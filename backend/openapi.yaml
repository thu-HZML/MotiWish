openapi: 3.0.3
info:
  title: MotiWish Backend API
  version: 0.2.0
  description: 面向安卓端游戏化时间管理应用的统一后端接口。
paths:
  /api/v1/ai/report-jobs/:
    get:
      operationId: ai_report_jobs_list
      description: 返回当前用户创建的 AI 报告任务列表，适合 AI 页或历史报告页使用。
      summary: 获取 AI 报告任务列表
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - AI
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAIReportJobListResponseList'
          description: ''
    post:
      operationId: ai_report_jobs_create
      description: 创建一条 AI 报告生成任务，用于后续异步分析、总结或推荐。
      summary: 创建 AI 报告任务
      tags:
      - AI
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIReportJob'
            examples:
              创建周报任务:
                value:
                  report_type: weekly
                  summary: 生成本周任务完成情况与建议
                  status: pending
                  input_payload:
                    range: 2026-W18
                  result_payload: {}
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AIReportJob'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AIReportJob'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIReportJobCreateResponse'
          description: ''
  /api/v1/ai/report-jobs/{id}/:
    get:
      operationId: ai_report_jobs_retrieve
      description: 返回一条具体的 AI 报告任务详情，包括输入、状态和结果。
      summary: 获取单个 AI 报告任务
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this AI报告任务.
        required: true
      tags:
      - AI
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIReportJobDetailResponse'
          description: ''
    put:
      operationId: ai_report_jobs_update
      description: 全量更新 AI 报告任务。
      summary: 更新 AI 报告任务
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this AI报告任务.
        required: true
      tags:
      - AI
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIReportJob'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AIReportJob'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AIReportJob'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIReportJob'
          description: ''
    patch:
      operationId: ai_report_jobs_partial_update
      description: 部分更新 AI 报告任务，例如回填状态或结果摘要。
      summary: 部分更新 AI 报告任务
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this AI报告任务.
        required: true
      tags:
      - AI
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAIReportJob'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAIReportJob'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAIReportJob'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIReportJob'
          description: ''
    delete:
      operationId: ai_report_jobs_destroy
      description: 删除一条 AI 报告任务记录。
      summary: 删除 AI 报告任务
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this AI报告任务.
        required: true
      tags:
      - AI
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/common/health/:
    get:
      operationId: common_health_retrieve
      summary: 健康检查
      tags:
      - Common
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
              examples:
                健康检查响应:
                  value:
                    success: true
                    code: OK
                    message: 服务运行正常
                    data:
                      service: motiwish-backend
                      status: ok
          description: ''
  /api/v1/common/legal-documents/:
    get:
      operationId: common_legal_documents_retrieve
      summary: 获取法律与隐私文档
      parameters:
      - in: query
        name: document_type
        schema:
          type: string
        description: 可选值：terms / privacy / data_collection / children
      tags:
      - Common
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalDocumentsResponse'
              examples:
                法律文档响应:
                  value:
                    success: true
                    code: OK
                    message: 获取法律与隐私文档成功
                    data:
                      documents:
                      - id: 1
                        document_type: privacy
                        title: MotiWish 隐私政策
                        version: '2026.04'
                        summary: 说明个人信息处理与用户权利。
                        content: 我们会在提供任务、钱包与画像分析服务时处理必要的个人信息。
                        effective_at: '2026-04-21T00:00:00+08:00'
                        prompt_notes:
                          used_in_ai_prompt:
                          - gender
                          - occupation
                          - bio
                          required_fields:
                          - nickname
                          - gender
                        updated_at: '2026-04-21T00:00:00+08:00'
                      description:
                      - 用户服务协议：说明产品使用规则、账号责任与服务边界。
                      - 隐私政策：说明个人信息处理目的、方式、保存期限与用户权利。
                      - 个人信息收集清单：说明收集字段、使用场景、是否必要。
                      - 未成年人说明：说明监护、使用限制与个人信息保护补充要求。
          description: ''
  /api/v1/gacha/pools/:
    get:
      operationId: gacha_pools_list
      description: 返回当前可用卡池列表，包括四档奖励和三层保底参数。
      summary: 获取卡池列表
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Gacha
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGachaPoolListResponseList'
          description: ''
  /api/v1/gacha/pools/{id}/:
    get:
      operationId: gacha_pools_retrieve
      description: 返回指定卡池详情，包括奖励、概率与保底阈值。
      summary: 获取单个卡池
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 卡池.
        required: true
      tags:
      - Gacha
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GachaPoolDetailResponse'
          description: ''
  /api/v1/gacha/pools/{id}/draw/:
    post:
      operationId: gacha_pools_draw_create
      description: 执行单抽或多抽。服务端会在事务中统一处理一级货币扣费、二级货币发放、保底状态推进和抽卡记录生成。
      summary: 执行抽卡
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 卡池.
        required: true
      tags:
      - Gacha
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GachaPool'
            examples:
              单抽请求:
                value:
                  times: 1
              十连请求:
                value:
                  times: 10
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GachaPool'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GachaPool'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GachaDrawResponse'
          description: ''
  /api/v1/gacha/pools/{id}/state/:
    get:
      operationId: gacha_pools_state_retrieve
      description: 返回当前用户在指定卡池上的抽卡累计与三层保底进度。
      summary: 查看当前卡池保底状态
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 卡池.
        required: true
      tags:
      - Gacha
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GachaStateResponse'
          description: ''
  /api/v1/gacha/records/:
    get:
      operationId: gacha_records_list
      description: 返回当前用户的抽卡历史记录。
      summary: 获取抽卡记录
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Gacha
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGachaRecordListResponseList'
          description: ''
  /api/v1/gacha/records/{id}/:
    get:
      operationId: gacha_records_retrieve
      description: 返回一条具体的抽卡结果记录。
      summary: 获取单条抽卡记录
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 抽卡记录.
        required: true
      tags:
      - Gacha
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GachaRecordDetailResponse'
          description: ''
  /api/v1/reports/dashboard/:
    get:
      operationId: reports_dashboard_retrieve
      description: 返回首页仪表盘所需的轻量统计数据，包括钱包余额和任务完成概览。适合首页、个人中心首页卡片使用。
      summary: 获取仪表盘报表
      tags:
      - Reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardReportResponse'
              examples:
                仪表盘报表示例:
                  value:
                    success: true
                    code: OK
                    message: 获取报表成功
                    data:
                      wallet:
                        primary_balance: 120
                        secondary_balance: 36
                      task_stats:
                        total: 58
                        completed: 41
          description: ''
  /api/v1/shop/items/:
    get:
      operationId: shop_items_list
      description: 返回当前用户创建的愿望商品列表，适合商城首页、愿望管理页使用。
      summary: 获取愿望商品列表
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Shop
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWishItemListResponseList'
          description: ''
    post:
      operationId: shop_items_create
      description: 创建一个可兑换的愿望商品或奖励项。
      summary: 创建愿望商品
      tags:
      - Shop
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WishItem'
            examples:
              创建愿望商品:
                value:
                  title: 周末看一场电影
                  description: 完成阶段目标后的放松奖励
                  source: manual
                  cost_secondary: 120
                  inventory: 1
                  is_enabled: true
                  ai_pricing:
                    source: manual
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WishItem'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WishItem'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishItemCreateResponse'
          description: ''
  /api/v1/shop/items/{id}/:
    get:
      operationId: shop_items_retrieve
      description: 返回一条愿望商品的详细配置。
      summary: 获取单个愿望商品
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 愿望商品.
        required: true
      tags:
      - Shop
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishItemDetailResponse'
          description: ''
    put:
      operationId: shop_items_update
      description: 全量更新愿望商品配置。
      summary: 更新愿望商品
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 愿望商品.
        required: true
      tags:
      - Shop
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WishItem'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WishItem'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WishItem'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishItem'
          description: ''
    patch:
      operationId: shop_items_partial_update
      description: 部分更新愿望商品，例如调整库存、价格或上下架状态。
      summary: 部分更新愿望商品
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 愿望商品.
        required: true
      tags:
      - Shop
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWishItem'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedWishItem'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedWishItem'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishItem'
          description: ''
    delete:
      operationId: shop_items_destroy
      description: 删除愿望商品及其后续可见性。
      summary: 删除愿望商品
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 愿望商品.
        required: true
      tags:
      - Shop
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/shop/items/{id}/redeem/:
    post:
      operationId: shop_items_redeem_create
      description: 消耗二级货币兑换指定愿望商品，并生成兑换记录。
      summary: 兑换愿望商品
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 愿望商品.
        required: true
      tags:
      - Shop
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WishItem'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WishItem'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WishItem'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishItemRedeemResponse'
          description: ''
  /api/v1/shop/redemptions/:
    get:
      operationId: shop_redemptions_list
      description: 返回当前用户的兑换历史，可用于商城历史页和奖励兑现跟踪页。
      summary: 获取兑换记录
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Shop
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRedemptionRecordListResponseList'
          description: ''
  /api/v1/shop/redemptions/{id}/:
    get:
      operationId: shop_redemptions_retrieve
      description: 返回一条具体的兑换记录明细。
      summary: 获取单条兑换记录
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 兑换记录.
        required: true
      tags:
      - Shop
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedemptionRecordDetailResponse'
          description: ''
  /api/v1/tasks/tasks/:
    get:
      operationId: tasks_tasks_list
      description: 返回当前登录用户创建的任务模板列表。这里返回的是任务定义，不是按日期展开后的任务实例。
      summary: 获取任务列表
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Tasks
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTaskListResponseList'
          description: ''
    post:
      operationId: tasks_tasks_create
      description: 创建一个任务模板。task_type 用于区分日常、周期和一次性任务；recurrence 用于描述周期规则。
      summary: 创建任务
      tags:
      - Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
            examples:
              创建每日学习任务:
                value:
                  title: 背单词 30 分钟
                  description: 每天晚饭后完成
                  task_type: recurring
                  recurrence: daily
                  weekdays: []
                  month_days: []
                  metric_key: study_minutes
                  target_value: 30
                  progress_target: 100
                  reward_primary: 15
                  penalty_primary: 3
                  starts_on: '2026-04-21'
                  ends_on: null
                  due_at: null
                  status: active
                  tags:
                  - study
                  - english
                  ai_metadata:
                    source: manual
              创建每周健身任务:
                value:
                  title: 去健身房训练
                  description: 固定在周一、周三、周六执行
                  task_type: recurring
                  recurrence: weekly
                  weekdays:
                  - 0
                  - 2
                  - 5
                  month_days: []
                  metric_key: ''
                  target_value: null
                  progress_target: 100
                  reward_primary: 20
                  penalty_primary: 5
                  starts_on: '2026-05-01'
                  ends_on: null
                  due_at: null
                  status: active
                  tags:
                  - health
                  - sport
                  ai_metadata:
                    source: manual
              创建一次性截止任务:
                value:
                  title: 提交课程大作业
                  description: 在截止日前上传最终版本
                  task_type: one_time
                  recurrence: none
                  weekdays: []
                  month_days: []
                  metric_key: ''
                  target_value: null
                  progress_target: 100
                  reward_primary: 50
                  penalty_primary: 0
                  starts_on: '2026-05-01'
                  ends_on: '2026-05-15'
                  due_at: '2026-05-15T23:59:00+08:00'
                  status: active
                  tags:
                  - school
                  - deadline
                  ai_metadata:
                    source: manual
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Task'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Task'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCreateResponse'
          description: ''
  /api/v1/tasks/tasks/{id}/:
    get:
      operationId: tasks_tasks_retrieve
      description: 返回指定任务模板的完整字段。
      summary: 获取单个任务
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 任务.
        required: true
      tags:
      - Tasks
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRetrieveResponse'
          description: ''
    put:
      operationId: tasks_tasks_update
      description: 全量更新任务模板。未提供的字段会被重置，因此更适合结构性修改。
      summary: 更新任务
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 任务.
        required: true
      tags:
      - Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Task'
          multipart/form-data:
            schema:
