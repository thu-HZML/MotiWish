openapi: 3.0.3
info:
  title: MotiWish Backend API
  version: 0.2.0
  description: 面向 Android 端游戏化时间管理应用的统一后端接口。
paths:
  /api/v1/ai/report-jobs/:
    get:
      operationId: ai_report_jobs_list
      summary: 获取 AI 报告任务列表
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - AI
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAIReportJobList'
          description: ''
    post:
      operationId: ai_report_jobs_create
      summary: 创建 AI 报告任务
      tags:
      - AI
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIReportJob'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AIReportJob'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AIReportJob'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIReportJobCreateResponse'
          description: ''
  /api/v1/ai/report-jobs/{id}/:
    get:
      operationId: ai_report_jobs_retrieve
      summary: 获取单个 AI 报告任务
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this AI 报告任务.
        required: true
      tags:
      - AI
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIReportJobDetailResponse'
          description: ''
    put:
      operationId: ai_report_jobs_update
      summary: 更新 AI 报告任务
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this AI 报告任务.
        required: true
      tags:
      - AI
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIReportJob'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AIReportJob'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AIReportJob'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIReportJob'
          description: ''
    patch:
      operationId: ai_report_jobs_partial_update
      summary: 部分更新 AI 报告任务
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this AI 报告任务.
        required: true
      tags:
      - AI
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAIReportJob'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAIReportJob'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAIReportJob'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIReportJob'
          description: ''
    delete:
      operationId: ai_report_jobs_destroy
      summary: 删除 AI 报告任务
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this AI 报告任务.
        required: true
      tags:
      - AI
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/ai/task-pricing-sessions/:
    get:
      operationId: ai_task_pricing_sessions_list
      summary: 获取任务定价会话列表
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - AI
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAITaskPricingSessionList'
          description: ''
    post:
      operationId: ai_task_pricing_sessions_create
      description: 前端提交任务草稿后，后端会读取用户画像和全局任务定价标准，返回 quote_payload。前端展示报价后，再调用 feedback
        接口让用户接受或反馈。
      summary: 创建任务定价会话
      tags:
      - AI
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AITaskPricingSessionCreate'
            examples:
              一次性任务:
                value:
                  task_payload:
                    title: 完成数据库课程复习
                    description: 整理索引、事务、范式相关笔记
                    task_type: one_time
                    recurrence: none
                    settlement_track: regular
                    difficulty_level: medium
                    progress_target: 100
                    tags:
                    - study
                    - database
              日常任务:
                value:
                  task_payload:
                    title: 英语听力 30 分钟
                    task_type: daily
                    recurrence: daily
                    settlement_track: regular
                    difficulty_level: medium
                    metric_key: study_minutes
                    target_value: 30
                    progress_target: 100
                    tags:
                    - english
              每周周期任务:
                value:
                  task_payload:
                    title: 每周健身 3 次
                    task_type: recurring
                    recurrence: weekly
                    settlement_track: regular
                    difficulty_level: medium
                    weekdays:
                    - 1
                    - 3
                    - 5
                    progress_target: 100
                    tags:
                    - fitness
              探索任务:
                value:
                  task_payload:
                    title: 排查训练脚本问题
                    task_type: one_time
                    recurrence: none
                    settlement_track: exploration
                    difficulty_level: high
                    estimated_focus_minutes: 180
                    progress_target: 100
                    tags:
                    - coding
                    - research
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AITaskPricingSessionCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AITaskPricingSessionCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AITaskPricingSessionCreateResponse'
          description: ''
  /api/v1/ai/task-pricing-sessions/{id}/:
    get:
      operationId: ai_task_pricing_sessions_retrieve
      summary: 获取任务定价会话详情
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this AI任务定价会话.
        required: true
      tags:
      - AI
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AITaskPricingSessionDetailResponse'
          description: ''
  /api/v1/ai/task-pricing-sessions/{id}/feedback/:
    post:
      operationId: ai_task_pricing_sessions_feedback_create
      description: action=revise 时根据偏高/偏低/详细说明重新定价；action=accept 时接受当前 quote_payload，创建正式任务，并更新用户动态画像。
      summary: 反馈或接受任务定价
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this AI任务定价会话.
        required: true
      tags:
      - AI
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AITaskPricingFeedback'
            examples:
              接受当前定价:
                value:
                  action: accept
              认为定价偏低:
                value:
                  action: revise
                  feedback_direction: too_low
                  feedback_text: 这个任务需要额外查资料，奖励可以再高一点。
              详细反馈:
                value:
                  action: revise
                  feedback_direction: detail
                  feedback_text: 惩罚偏重，我最近压力比较大，希望失败成本轻一些。
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AITaskPricingFeedback'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AITaskPricingFeedback'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AITaskPricingFeedbackResponse'
          description: ''
  /api/v1/common/health/:
    get:
      operationId: common_health_retrieve
      summary: 健康检查
      tags:
      - Common
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
              examples:
                健康检查响应:
                  value:
                    success: true
                    code: OK
                    message: 服务运行正常
                    data:
                      service: motiwish-backend
                      status: ok
          description: ''
  /api/v1/common/legal-documents/:
    get:
      operationId: common_legal_documents_retrieve
      summary: 获取法律与隐私文档
      parameters:
      - in: query
        name: document_type
        schema:
          type: string
        description: 可选值：terms / privacy / data_collection / children
      tags:
      - Common
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalDocumentsResponse'
              examples:
                法律文档响应:
                  value:
                    success: true
                    code: OK
                    message: 获取法律与隐私文档成功
                    data:
                      documents:
                      - id: 1
                        document_type: privacy
                        title: MotiWish 隐私政策
                        version: '2026.04'
                        summary: 说明个人信息处理与用户权利。
                        content: 我们会在提供任务、钱包与画像分析服务时处理必要的个人信息。
                        effective_at: '2026-04-21T00:00:00+08:00'
                        prompt_notes:
                          used_in_ai_prompt:
                          - gender
                          - occupation
                          - bio
                          required_fields:
                          - nickname
                          - gender
                        updated_at: '2026-04-21T00:00:00+08:00'
                      description:
                      - 用户服务协议：说明产品使用规则、账号责任与服务边界。
                      - 隐私政策：说明个人信息处理目的、方式、保存期限与用户权利。
                      - 个人信息收集清单：说明收集字段、使用场景、是否必要。
                      - 未成年人说明：说明监护、使用限制与个人信息保护补充要求。
          description: ''
  /api/v1/gacha/pools/:
    get:
      operationId: gacha_pools_list
      description: 返回当前可用卡池列表，包括四档奖励和三层保底参数。
      summary: 获取卡池列表
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Gacha
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGachaPoolList'
          description: ''
  /api/v1/gacha/pools/{id}/:
    get:
      operationId: gacha_pools_retrieve
      description: 返回指定卡池详情，包括奖励、概率与保底阈值。
      summary: 获取单个卡池
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 卡池.
        required: true
      tags:
      - Gacha
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GachaPoolDetailResponse'
          description: ''
  /api/v1/gacha/pools/{id}/draw/:
    post:
      operationId: gacha_pools_draw_create
      description: 执行单抽或多抽。服务端会在事务中统一处理一级货币扣费、二级货币发放、保底状态推进和抽卡记录生成。
      summary: 执行抽卡
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 卡池.
        required: true
      tags:
      - Gacha
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GachaPool'
            examples:
              单抽请求:
                value:
                  times: 1
              十连请求:
                value:
                  times: 10
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GachaPool'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GachaPool'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GachaDrawResponse'
          description: ''
  /api/v1/gacha/pools/{id}/state/:
    get:
      operationId: gacha_pools_state_retrieve
      description: 返回当前用户在指定卡池上的抽卡累计与三层保底进度。
      summary: 查看当前卡池保底状态
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 卡池.
        required: true
      tags:
      - Gacha
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GachaStateResponse'
          description: ''
  /api/v1/gacha/records/:
    get:
      operationId: gacha_records_list
      description: 返回当前用户的抽卡历史记录。
      summary: 获取抽卡记录
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Gacha
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGachaDrawRecordList'
          description: ''
  /api/v1/gacha/records/{id}/:
    get:
      operationId: gacha_records_retrieve
      description: 返回一条具体的抽卡结果记录。
      summary: 获取单条抽卡记录
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 抽卡记录.
        required: true
      tags:
      - Gacha
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GachaRecordDetailResponse'
          description: ''
  /api/v1/reports/dashboard/:
    get:
      operationId: reports_dashboard_retrieve
      description: 返回首页仪表盘所需的轻量统计数据，包括钱包余额和任务完成概览。适合首页、个人中心首页卡片使用。
      summary: 获取仪表盘报表
      tags:
      - Reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardReportResponse'
              examples:
                仪表盘报表示例:
                  value:
                    success: true
                    code: OK
                    message: 获取报表成功
                    data:
                      wallet:
                        primary_balance: 120
                        secondary_balance: 36
                      task_stats:
                        total: 58
                        completed: 41
          description: ''
  /api/v1/shop/inventory/:
    get:
      operationId: shop_inventory_list
      summary: 获取库存列表
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Shop
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInventoryListResponseList'
          description: ''
  /api/v1/shop/inventory/{id}/:
    get:
      operationId: shop_inventory_retrieve
      summary: 获取单个库存道具
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 用户道具库存.
        required: true
      tags:
      - Shop
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryDetailResponse'
          description: ''
  /api/v1/shop/inventory/{id}/use/:
    post:
      operationId: shop_inventory_use_create
      description: 当前支持主动使用还债卡和放纵日卡。
      summary: 使用库存道具
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 用户道具库存.
        required: true
      tags:
      - Shop
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInventory'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserInventory'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserInventory'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryUseResponse'
          description: ''
  /api/v1/shop/items/:
    get:
      operationId: shop_items_list
      description: 返回当前用户可见的商店商品，包括公共商品和用户自建愿望商品。
      summary: 获取商店商品列表
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Shop
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedShopItemListResponseList'
          description: ''
    post:
      operationId: shop_items_create
      description: 用户自定义愿望商品，例如旅游奖励、外食奖励等。自建商品只属于当前用户，并只会出现在自己的商品列表中。
      summary: 创建自建愿望商品
      tags:
      - Shop
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomWishItem'
            examples:
              创建旅游奖励:
                value:
                  title: Travel reward
                  description: A self-defined trip reward.
                  price_tier: large
                  price_secondary: 800
                  rarity: epic
                  inventory: 1
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomWishItem'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomWishItem'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomWishItemCreateResponse'
          description: ''
  /api/v1/shop/items/{id}/:
    put:
      operationId: shop_items_update
      summary: 更新自建愿望商品
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 商店商品.
        required: true
      tags:
      - Shop
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomWishItem'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomWishItem'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomWishItem'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomWishItem'
          description: ''
    patch:
      operationId: shop_items_partial_update
      summary: 部分更新自建愿望商品
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 商店商品.
        required: true
      tags:
      - Shop
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCustomWishItem'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCustomWishItem'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCustomWishItem'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomWishItem'
          description: ''
    delete:
      operationId: shop_items_destroy
      summary: 删除自建愿望商品
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 商店商品.
        required: true
      tags:
      - Shop
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/shop/items/{id}/redeem/:
    post:
      operationId: shop_items_redeem_create
      description: 消耗二级货币购买商品。愿望商品会生成待处理的兑换记录。
      summary: 购买商店商品
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 商店商品.
        required: true
      tags:
      - Shop
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WishItem'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WishItem'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WishItem'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopItemRedeemResponse'
          description: ''
  /api/v1/shop/redemptions/:
    get:
      operationId: shop_redemptions_list
      summary: 获取兑换/购买记录
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
